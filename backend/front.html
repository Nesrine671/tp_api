<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ma Top List d'Animés</title>
  <link rel="stylesheet" href="front.css" />
</head>
<body>

  <header>
    <h1>Ma Top List d'Animés</h1>
  </header>

  <main>
    <!-- Formulaire ajout animé -->
    <section class="card">
      <h2>Ajouter un animé</h2>
      <form>
        <input type="text" placeholder="Titre de l'animé" />
        <input type="number" placeholder="Note (1-10)" min="1" max="10" />
        <input type="text" placeholder="Commentaire (optionnel)" />
        <button type="submit">Ajouter</button>
      </form>
    </section>

    <!-- Liste des animés -->
    <section class="card">
      <h2>Ma liste</h2>
      <ul class="anime-list">
        <li>
          <span class="rank">1</span>
          <div class="info">
            <strong>Tokyo Revengers</strong>
            <small>Note : 10</small>
            <p>Masterclass</p>
          </div>
          <div class="actions">
            <button class="edit"><small>Editer</small></button>
            <button class="delete"><small>Supprimé</small></button>
          </div>
        </li>

        <li>
          <span class="rank">2</span>
          <div class="info">
            <strong>Death Note</strong>
            <small>Note : 6</small>
          </div>
          <div class="actions">
            <button class="edit"><small>Editer</small></button>
            <button class="delete"><small>Supprimé</small></button>
          </div>
        </li>
      </ul>
    </section>

    <!-- Partage -->
    <section class="card share">
      <h2>Partager ma liste</h2>
      <input type="text" value="https://monsite.com/share/abc123" readonly />
    </section>
  </main>

  <script src="front.js"></script>
</body>
</html>
